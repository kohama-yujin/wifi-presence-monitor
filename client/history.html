<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>在室履歴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=Shippori+Mincho:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/client/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-left">
        <h1 class="title">在室履歴</h1>
        <div class="date-nav" role="group" aria-label="日付の切替">
          <button type="button" id="prev-day" class="date-nav-btn" aria-label="前の日">
            ＜
          </button>
          <p id="view-date" class="view-date">—</p>
          <button type="button" id="next-day" class="date-nav-btn" aria-label="次の日">
            ＞
          </button>
        </div>
        <p id="subtitle" class="subtitle">過去の在室記録を表示します</p>
        <p class="nav-links">
          <a href="/">リアルタイム在室管理を開く</a>
        </p>
      </div>
      <div class="top-right">
        <p id="clock-date" class="clock-date">—</p>
        <p id="clock-time" class="clock-time">—</p>
      </div>
    </header>

    <main id="boards" class="boards" aria-live="polite"></main>

    <script src="/client/history.js"></script>
  </body>
</html>
